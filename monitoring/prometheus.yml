global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'nodejs_backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5000']

  - job_name: 'celery_exporter'
    static_configs:
      - targets: ['celery-exporter:9808']

  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:15692']
