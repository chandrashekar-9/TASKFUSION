<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | TaskFusion Pro</title>

    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="dashboard.css" />
</head>

<body class="settings-body">

    <div class="sidebar">
        <div class="logo">
            <span data-feather="grid" class="logo-icon"></span>
            <span class="logo-text">TaskFusion Pro</span>
        </div>

        <nav class="premium-nav">
            <div class="nav-title">Navigation</div>
            <a href="dashboard.html" class="nav-item">
                <i data-feather="home"></i> Dashboard
            </a>
            <a href="ai-task-center.html" class="nav-item">
                <i data-feather="zap"></i> AI Task Center
            </a>
            <a href="settings.html" class="nav-item active">
                <i data-feather="settings"></i> Settings
            </a>
        </nav>

        <div class="profile-section">

            <button class="logoutBtn" onclick="logout()">
                <i data-feather="log-out"></i> Logout
            </button>
        </div>

        <div class="task-history-section">
            <h3 class="history-title">Recent Task History</h3>
            <div id="historyList">
            </div>
        </div>
    </div>

    <div class="main">

        <div class="header">Account Settings</div>
        <p class="header-subtext">Manage your profile, preferences, and API access.</p>

        <div class="card settings-card">
            <h3 class="card-title">Profile Information</h3>
            <form>
                <div class="setting-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" value="Pro User" />
                </div>

                <div class="setting-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" value="user@taskfusion.pro" />
                </div>

                <h3 class="card-title" style="margin-top: 30px;">Display Settings</h3>
                <div class="setting-group toggle-switch-container">
                    <label for="themeToggle" style="margin-bottom: 0;">Dark Mode</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                        <span class="slider"></span>
                    </label>
                </div>


                <button type="submit" class="submit-btn" style="width: 200px; margin-top: 30px;">
                    <i data-feather="save"></i> Save Changes
                </button>
            </form>
        </div>
    </div>

    <script src="settings.js"></script>
    <script src="dashboard.js"></script>
    <script>
        feather.replace();
    </script>
</body>

</html>
